name: CI - Test (unit tests)

on:
  pull_request:
    branches: [ test ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow scikit-learn

      - name: Start MLflow server
        run: |
          mkdir -p mlruns
          nohup mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns \
            --host 127.0.0.1 --port 5001 > mlflow.log 2>&1 &
          sleep 5

      - name: Create dummy MLflow run
        id: dummy
        run: |
          python scripts/create_dummy_mlflow_run.py > runid.txt
          echo "MLFLOW_RUN_ID=$(cat runid.txt)" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_URI=http://127.0.0.1:5001" >> $GITHUB_ENV

      - name: Run pytest
        run: pytest -v
