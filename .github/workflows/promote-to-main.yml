name: Promote to main

on:
  workflow_run:
    workflows: ["CI - Test (unit tests)"]
    types: [completed]

jobs:
  create_pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Promote branch → main"
          base: main
          head: test
          body: "Auto PR created after successful CI test workflow."
